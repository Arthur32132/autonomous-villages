title = "Autonomous Villages secret scanning"

[extend]
useDefault = true

# Build manifests record SHA-256 for Java source paths. The word Access in a
# filename can trigger generic-api-key; only this exact checksum line is ignored.
[[rules]]
id = "generic-api-key"
[[rules.allowlists]]
description = "SHA-256 entries for Java source files"
regexTarget = "line"
regexes = ['''^\s*"[^"\r\n]+\.java":\s*"[a-f0-9]{64}",?\s*$''']
