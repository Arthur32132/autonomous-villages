plugins { id 'net.fabricmc.fabric-loom' version "${loom_version}" }
group = 'dev.autonomousvillages'
version = project.findProperty('version')
base { archivesName = 'autonomous-villages' }
loom { splitEnvironmentSourceSets(); mods { 'autonomous_villages' { sourceSet sourceSets.main } } }
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    implementation project(':navigationAi')
    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.12.2'
}
sourceSets {
    soak {
        java.srcDir('tools/soak/java')
        resources.srcDir('tools/soak/resources')
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}
tasks.register('soakJar', Jar) {
    dependsOn tasks.soakClasses
    from sourceSets.soak.output
    archiveBaseName = 'autonomous-villages-soak'
}
tasks.named('check') { dependsOn 'soakClasses' } // 'build' fails when a mod refactor breaks tools/soak/java
processResources {
    def ver = project.version.toString()
    inputs.property 'version', ver
    filesMatching('fabric.mod.json') { expand 'version': ver }
}
tasks.withType(JavaCompile).configureEach { options.release = 25; options.encoding = 'UTF-8' }
java { withSourcesJar(); sourceCompatibility = JavaVersion.VERSION_25; targetCompatibility = JavaVersion.VERSION_25 }
tasks.test { useJUnitPlatform() }
// Release docs keep their repo paths in build/distribution; a missing one fails sourceTree and assembleDistribution.
// 0.2-era documents live in docs/archive and are not shipped; ReleaseMetadataTest reads this list.
def releaseDocs = ['README.md','LICENSE','CHANGELOG.md','CONTRIBUTING.md','SECURITY.md','docs/PLAN-v0.3.md','docs/ARCHITECTURE.md','tools/soak/README.md']
def navDir = project(':navigationAi').projectDir
def navReleaseDocs = ['docs/RELEASE_0.2.2.md']
def requireFiles = { Collection<File> fs -> def missing = fs.findAll { !it.isFile() }; if (missing) throw new GradleException("Distribution files missing: ${missing.join(', ')}") }
tasks.register('sourceTree', Zip) {
    def avFiles = ['gradlew','gradlew.bat','build.gradle','settings.gradle','gradle.properties','AGENTS.md','docs/WORKLOG.md'] + releaseDocs
    def navFiles = ['gradlew','gradlew.bat','build.gradle','settings.gradle','gradle.properties','LICENSE','README.md']
    def required = avFiles.collect { file(it) } + navFiles.collect { new File(navDir, it) }
    archiveFileName = "autonomous-villages-${project.version}-source.zip"
    destinationDirectory = layout.buildDirectory.dir('sources')
    reproducibleFileOrder = true
    preserveFileTimestamps = false
    from(projectDir) {
        into 'AutonomousVillages'
        include(['src/**','tools/**','gradle/**'] + avFiles)
        exclude '**/__pycache__/**','**/lab/**'
    }
    from(navDir) {
        into 'MinecraftmodNavigationAi'
        include(['src/**','tools/regression/**','gradle/**','docs/*.md'] + navFiles)
        exclude '**/__pycache__/**','tools/regression/results/**'
    }
    doFirst { requireFiles(required) }
}
tasks.register('assembleDistribution', Sync) {
    def distDir = layout.buildDirectory.dir('distribution')
    def ver = project.version.toString()
    def required = releaseDocs.collect { file(it) } + navReleaseDocs.collect { new File(navDir, it) }
    def roots = [AutonomousVillages: projectDir, MinecraftmodNavigationAi: navDir]
    def srcTrees = roots.collectEntries { prefix, dir -> [(prefix): fileTree(new File(dir, 'src')) { include '**/*.java','**/*.json' }] }
    dependsOn 'jar', 'sourcesJar', ':navigationAi:jar', ':navigationAi:sourcesJar', 'sourceTree'
    into distDir
    from(tasks.named('jar', Jar).flatMap { it.archiveFile })
    from(project(':navigationAi').tasks.named('jar', Jar).flatMap { it.archiveFile })
    releaseDocs.each { p -> from(p) { if (p.contains('/')) into(p.substring(0, p.lastIndexOf('/'))) } }
    navReleaseDocs.each { p -> from(new File(navDir, p)) { into 'docs/navigation-ai' } }
    from(tasks.named('sourceTree', Zip).flatMap { it.archiveFile }) { into 'sources' }
    doFirst {
        requireFiles(required)
        if (destinationDir.canonicalFile != distDir.get().asFile.canonicalFile) throw new GradleException('Distribution must stay in build/distribution')
    }
    doLast {
        def sha = { File f -> java.security.MessageDigest.getInstance('SHA-256').digest(f.bytes).encodeHex().toString() }
        def folder = distDir.get().asFile
        def artifacts = folder.listFiles().findAll { it.name.endsWith('.jar') }.sort { it.name }.collectEntries { [(it.name):sha(it)] }
        def sources = [:]
        roots.each { prefix, dir ->
            def found = new TreeMap<String, File>()
            srcTrees[prefix].visit { d -> if (!d.directory) found['src/' + d.relativePath.pathString] = d.file }
            found.each { rel, f -> sources[prefix+'/'+rel] = sha(f) }
            ['build.gradle','settings.gradle','gradle.properties'].each { n -> def f = new File(dir, n); if (f.exists()) sources[prefix+'/'+n] = sha(f) }
        }
        new File(folder,'build-manifest.json').text=groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([version:ver,jars:artifacts,sources:sources]))
    }
}
tasks.register('bundleDistribution', Zip) {
    dependsOn tasks.assembleDistribution
    from layout.buildDirectory.dir('distribution')
    destinationDirectory = layout.buildDirectory
    archiveFileName = "autonomous-villages-${project.version}-bundle.zip"
    reproducibleFileOrder = true
    preserveFileTimestamps = false
}
